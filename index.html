<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Münchner Spielplan</title>
  <meta name="description" content="Theater, Oper, Konzert und Kino in München: alle Termine an einem Ort, täglich aktualisiert.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BODY:START -->
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="#top" id="top">
      <span class="brand-name">München <span>Spielplan</span></span>
      <span class="brand-sub" id="brand-sub">Theater · Oper · Konzert · Kino in München</span>
    </a>
    <div class="mast-right">
      <span class="updated" id="updated"></span>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="row">
      <label class="search" for="q">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off">
      </label>
      <button class="toggle" id="today" type="button" aria-pressed="false">Heute</button>
      <button class="toggle" id="available" type="button" aria-pressed="false">Nur mit Karten</button>
      <input class="date-jump" id="date" type="date">
      <button class="chip filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="more-filters">Filter</button>
    </div>
    <div class="more-filters" id="more-filters">
      <div class="row"><div class="chips" id="cats" aria-label="Kategorie"></div><button class="clear" id="clear" type="button">Zurücksetzen</button></div>
      <div class="chips" id="venues" aria-label="Häuser"></div>
    </div>
    <nav class="strip" id="strip" aria-label="Tage"></nav>
  </div>
</div>

<main class="wrap">
  <p class="status-msg" id="status-msg" role="status"></p>
  <div id="programme"></div>
</main>

<footer>
  <div class="wrap">
    <h2 class="sources-h" id="sources-h">Quellen</h2>
    <div class="sources" id="sources"></div>
    <p class="fine" id="fine"></p>
  </div>
</footer>
<!-- BODY:END -->
<script src="app.js" defer></script>
</body>
</html>
